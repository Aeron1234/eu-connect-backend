# Install in sites-available and include through sites-enabled at http scope.
# Replace eu-connect.example.edu. Certbot adds HTTPS after HTTP is reachable.
map $http_upgrade $euconnect_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name eu-connect.example.edu;
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering off;

    # Preserve the URI prefix expected by the backend's dual mounts.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:7000;
    }
    location /eu-connect/api/ {
        proxy_pass http://127.0.0.1:7000;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:7000;
        # Defining proxy_set_header here replaces inherited proxy header settings.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $euconnect_connection_upgrade;
    }

    # Keep Next report APIs, socket-ticket endpoint and Server Actions here.
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

